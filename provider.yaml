{
  "apiVersion": "specbound.example/v1alpha1",
  "kind": "EvidenceProviderPack",
  "metadata": {
    "id": "org.specbound.example-provider",
    "version": "1.1.0",
    "title": "Synthetic fixture provider",
    "description": "Synthetic examples only; not infrastructure evidence."
  },
  "runtime": {
    "kind": "approved-container",
    "image": "python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54",
    "entrypoint": [
      "python",
      "-c",
      "\"\"\"Emit one explicitly synthetic observation for the requested subject and scope.\"\"\"\n\nimport datetime\nimport json\nimport os\n\nrequest = json.loads(os.environ[\"SPECBOUND_REQUEST\"])\nif request[\"capabilities\"] != [\"demo.fixture/v1\"] or request[\"credentialsRef\"] is not None:\n    raise ValueError(\"Only the credential-free demo.fixture/v1 capability is supported\")\n\nresponse = {\n    \"schemaVersion\": 1,\n    \"observations\": [{\n        \"subjectId\": request[\"subject\"][\"id\"],\n        \"capability\": \"demo.fixture/v1\",\n        \"scope\": request[\"scope\"],\n        \"observedAt\": datetime.datetime.now(datetime.timezone.utc).isoformat().replace(\"+00:00\", \"Z\"),\n        \"provenance\": {\"sourceRef\": \"fixture:synthetic-example\"},\n        \"value\": {\"synthetic\": True, \"message\": \"example-only\"},\n    }],\n}\nprint(json.dumps(response, separators=(\",\", \":\")))\n"
    ],
    "input": "contracts/collect-request.json",
    "output": "contracts/observation.json"
  },
  "capabilities": [
    {
      "id": "demo.fixture",
      "version": "v1",
      "outputSchema": "schemas/fixture.json"
    }
  ],
  "permissions": {},
  "tests": [
    "tests/request.json"
  ]
}
